<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Заявки — CRB</title>
<meta name="theme-color" content="#0B132B">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B132B;
    --bg: #EEF1F8;
    --card: #FFFFFF;
    --text: #0B132B;
    --muted: #6E7688;
    --border: #E5E7EB;
    --ice-soft: #EAF0FF;
    --accent: #0A84FF;
    --danger: #B23A3A;
    --danger-bg: #FBE7E7;
    --ok: #1E7A4C;
    --ok-bg: #E3F5E9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-bottom: 32px;
    position: relative;
    overflow-x: hidden;
  }
  /* --- Fon: boy, harakatlanuvchi "Liquid Glass" nur dog'lari --- */
  body::before {
    content: "";
    position: fixed; inset: 0;
    z-index: -2;
    background: linear-gradient(165deg, #EDF1FB 0%, #E6EBFA 45%, #EEF1F8 100%);
  }
  .aurora-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    z-index: -1;
    pointer-events: none;
    will-change: transform;
  }
  .aurora-blob.a1 {
    width: 320px; height: 320px; top: -6%; left: -10%;
    background: radial-gradient(circle, rgba(10,132,255,0.35), transparent 70%);
    animation: blob-drift-1 20s ease-in-out infinite;
  }
  .aurora-blob.a2 {
    width: 300px; height: 300px; top: 20%; right: -12%;
    background: radial-gradient(circle, rgba(191,90,242,0.28), transparent 70%);
    animation: blob-drift-2 24s ease-in-out infinite;
  }
  .aurora-blob.a3 {
    width: 280px; height: 280px; bottom: -8%; left: 20%;
    background: radial-gradient(circle, rgba(0,199,190,0.26), transparent 70%);
    animation: blob-drift-3 18s ease-in-out infinite;
  }
  @keyframes blob-drift-1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,40px) scale(1.1); } }
  @keyframes blob-drift-2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,30px) scale(1.06); } }
  @keyframes blob-drift-3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-30px) scale(0.95); } }

  .topbar {
    background: rgba(11,19,43,0.72);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    color: #fff;
    padding: 18px 18px 20px; position: sticky; top: 0; z-index: 10;
    border-radius: 0 0 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 16px 34px -18px rgba(11,19,43,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
    opacity: 0;
    animation: topbar-in 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes topbar-in {
    0% { opacity: 0; transform: translateY(-14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .topbar-row { display: flex; align-items: center; gap: 11px; }
  .topbar-icon {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(160deg, #3D9BFF, #0B132B 130%);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 12px -4px rgba(10,132,255,0.6), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .topbar-icon::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.4), transparent 55%);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0 47px; font-size: 13px; color: rgba(255,255,255,0.55); }
  .back-btn {
    display: none; align-items: center; gap: 6px; background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16); color: #fff; padding: 7px 14px; border-radius: 999px;
    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 12px; cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.2); }
  .content { padding: 16px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .menu-item {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 16px 14px; text-align: left; cursor: pointer;
    box-shadow: 0 10px 26px -16px rgba(11,19,43,0.28), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.12s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: item-in 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes item-in {
    0% { opacity: 0; transform: translateY(14px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .menu-item::before {
    content: "";
    position: absolute; top: -50%; left: -20%;
    width: 140%; height: 100%;
    background: radial-gradient(ellipse at 25% 0%, rgba(255,255,255,0.5), transparent 60%);
    pointer-events: none;
  }
  .menu-item:active { transform: scale(0.96); }
  .menu-item .icon {
    width: 44px; height: 44px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; margin-bottom: 12px;
    color: #fff;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 14px -5px var(--isd, rgba(11,19,43,0.35)), inset 0 1px 0 rgba(255,255,255,0.4);
    transform: scale(0.5);
    animation: icon-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards;
  }
  @keyframes icon-pop {
    0% { transform: scale(0.5); }
    100% { transform: scale(1); }
  }
  .menu-item .icon::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.4), transparent 55%);
  }
  .menu-item .label { position: relative; font-weight: 700; font-size: 13.5px; line-height: 1.28; color: var(--navy); }
  .menu-item .chevron {
    position: absolute; top: 16px; right: 14px; color: rgba(11,19,43,0.32); font-size: 15px;
  }
  .card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 18px; margin-bottom: 14px;
    box-shadow: 0 14px 32px -18px rgba(11,19,43,0.28), inset 0 1px 0 rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: card-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes card-in {
    0% { opacity: 0; transform: translateY(16px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card::before {
    content: "";
    position: absolute; top: -60%; left: -20%;
    width: 140%; height: 120%;
    background: radial-gradient(ellipse at 25% 0%, rgba(255,255,255,0.45), transparent 60%);
    pointer-events: none;
  }
  .field {
    margin-bottom: 14px; position: relative;
    opacity: 0;
    animation: field-in 0.35s ease forwards;
  }
  @keyframes field-in {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select {
    width: 100%; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(11,19,43,0.08);
    font-family: 'Manrope', sans-serif; font-size: 15px; background: rgba(255,255,255,0.65); color: var(--text);
    position: relative;
  }
  .field input[type=text]:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 3px rgba(10,132,255,0.16);
  }
  .field textarea { resize: vertical; min-height: 90px; }
  .org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .org-btn {
    padding: 12px 8px; border-radius: 13px; border: 1.5px solid rgba(11,19,43,0.08);
    background: rgba(255,255,255,0.55); font-family: 'Manrope', sans-serif; font-size: 12.5px; font-weight: 700;
    cursor: pointer; text-align: center; color: var(--text);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .org-btn.selected { border-color: transparent; background: var(--accent); color: #fff; box-shadow: 0 8px 18px -8px rgba(10,132,255,0.55); }
  .type-row { display: flex; gap: 8px; }
  .type-row .org-btn { flex: 1; }
  .file-drop {
    border: 1.5px dashed rgba(11,19,43,0.18); border-radius: 15px; padding: 18px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.4);
  }
  .file-drop i { margin-right: 5px; }
  .file-drop.has-file { border-style: solid; border-color: var(--accent); color: var(--text); background: rgba(10,132,255,0.08); }
  .file-list { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .file-list div { padding: 3px 0; }
  .submit-btn {
    width: 100%; padding: 15px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff; font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px;
    box-shadow: 0 14px 28px -10px rgba(10,132,255,0.55);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.5; box-shadow: none; }
  .submit-btn i.ti-loader-2 { animation: spin 0.8s linear infinite; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .hint i { color: #C2650F; margin-right: 2px; }
  /* So'rov muvaffaqiyatli yuborilgach chiqadigan to'liq ekran holati -
     shunchaki pastki kichik toast o'rniga (real foydalanuvchi so'ragan
     yaxshilanish: aniq, "tugadi" degan hissi beradigan ekran). */
  .success-screen {
    position: fixed; inset: 0; z-index: 999;
    background: linear-gradient(165deg, #34D399 0%, #10B981 55%, #059669 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 28px; text-align: center; color: #fff;
    animation: success-fade-in 0.25s ease forwards;
  }
  @keyframes success-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .success-check {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center;
    font-size: 44px; line-height: 1;
    animation: success-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
  }
  @keyframes success-pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .success-title { font-size: 22px; font-weight: 800; margin-top: 20px; }
  .success-sub { font-size: 15px; opacity: 0.92; margin-top: 10px; max-width: 300px; line-height: 1.5; }
  .success-sub b { font-weight: 800; }
  .success-continue {
    margin-top: 32px; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff; padding: 13px 30px; border-radius: 999px; font-weight: 700; font-size: 15px;
  }
  .success-continue:active { transform: scale(0.96); }
  .toast {
    position: fixed; bottom: 18px; left: 16px; right: 16px; z-index: 50;
    background: rgba(11,19,43,0.85);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    color: #fff; padding: 13px 16px; border-radius: 16px;
    font-size: 13px; text-align: center; font-weight: 600; opacity: 0; transform: translateY(12px);
    transition: all 0.25s ease; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: rgba(178,58,58,0.9); }
  .toast.ok { background: rgba(30,122,76,0.9); }
  .step-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="aurora-blob a1"></div>
<div class="aurora-blob a2"></div>
<div class="aurora-blob a3"></div>

<div class="topbar">
  <button class="back-btn" id="backBtn"><i class="ti ti-arrow-left" aria-hidden="true"></i> Назад</button>
  <div class="topbar-row">
    <div class="topbar-icon"><i class="ti ti-list-details" aria-hidden="true" style="color:#fff;"></i></div>
    <h1 id="pageTitle">Заявки</h1>
  </div>
  <p id="pageSub">Выберите тип запроса</p>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var API_URL = "https://script.google.com/macros/s/AKfycbzi9RqBAUtexFo4SW0ZVvCq6kjkmLKMCX8_1L6pS5eBYbqDrffaak2yqTveuMPqxadl/exec";

  var ORGS = [
    "TOSHTAN AUTO", "OLTIN TULPOR TRADE", "OLTIN TULPOR MOTORS", "OLTIN TULPOR MOTOR",
    "BEDACHI", "HYUNDAI RM", "HYUNDAI UZBEKISTAN", "GEE MOTORS", "GEE KD",
  ];

  var content = document.getElementById("content");
  var pageTitle = document.getElementById("pageTitle");
  var pageSub = document.getElementById("pageSub");
  var backBtn = document.getElementById("backBtn");
  var toastEl = document.getElementById("toast");

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (kind ? " " + kind : "");
    setTimeout(function () { toastEl.className = "toast"; }, 2600);
  }

  // So'rov muvaffaqiyatli yuborilgach chiqadigan to'liq ekran holati -
  // pastki kichik toast o'rniga (real foydalanuvchi so'ragan
  // yaxshilanish: aniq, "tugadi" degan hissi beradigan ekran).
  // "Отправить ещё" bosilsa - berilgan renderAgain() qayta chaqiriladi
  // (forma tozalangan holda qayta ko'rsatiladi), "Назад" bosilsa - menyuga.
  function showSuccessScreen(approverName, renderAgain) {
    var el = document.createElement("div");
    el.className = "success-screen";
    el.innerHTML =
      "<div class='success-check'><i class='ti ti-check' aria-hidden='true'></i></div>" +
      "<div class='success-title'>Отправлено!</div>" +
      "<div class='success-sub'>" +
      (approverName ? "Ваш запрос отправлен: <b>" + esc(approverName) + "</b>" : "Ваш запрос отправлен.") +
      "</div>" +
      "<button class='success-continue' data-act='again'>Отправить ещё</button>" +
      "<button class='success-continue' data-act='back' style='margin-top:12px;background:transparent;border-color:rgba(255,255,255,.35);'>← Назад в меню</button>";
    document.body.appendChild(el);
    el.querySelector("[data-act='again']").onclick = function () {
      el.remove();
      content.innerHTML = "";
      renderAgain();
    };
    el.querySelector("[data-act='back']").onclick = function () {
      el.remove();
      if (backBtn.onclick) backBtn.onclick();
    };
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        var base64 = result.split(",")[1] || "";
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // MUHIM: oddiy fetch() hech qachon o'zi "vaqti tugadi" deb to'xtamaydi -
  // agar server (Apps Script) sekinlashib ketsa yoki internet uzilib
  // qolsa, so'rov ABADIY kutib turadi va tugma "Отправка..." holatida
  // qotib qoladi (real foydalanuvchi xabar bergan xato). Shu sabab har
  // bir so'rovga aniq vaqt chegarasi qo'yamiz - shundan keyin so'rov
  // avtomatik bekor qilinib, tushunarli xato ko'rsatiladi va tugma
  // yana bosish mumkin bo'lgan holatga qaytadi.
  async function fetchWithTimeout(url, options, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs);
    try {
      return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
    } catch (e) {
      if (e && e.name === "AbortError") {
        throw new Error("Сервер не отвечает. Проверьте интернет и попробуйте ещё раз.");
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function uploadFile(file) {
    var base64 = await fileToBase64(file);
    var resp = await fetchWithTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "uploadFile",
        filename: file.name,
        mimeType: file.type || "application/octet-stream",
        base64: base64,
      }),
    }, 45000);
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data; // { ok, url, fileId, name }
  }

  // "Зарплата" bo'limi uchun - tg.sendData() ISHLATMAYDI, to'g'ridan-
  // to'g'ri shu backend'ga so'rov yuboradi (Mini App OCHIQ qoladi).
  function getChatId() {
    return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id)
      ? String(tg.initDataUnsafe.user.id) : "";
  }

  function getEmployeeName() {
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      var u = tg.initDataUnsafe.user;
      return [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || "";
    }
    return "";
  }

  async function callApi(action, params) {
    var resp = await fetchWithTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify(Object.assign({ action: action }, params || {})),
    }, 30000);
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  // Real foydalanuvchi so'ragan: sendData() chaqirilgach ba'zi Telegram
  // mijozlarida (masalan Desktop) Mini App darhol vizual ravishda
  // yopilmasligi mumkin - forma va pastki kichik toast ekranda
  // "osilib qolganday" ko'rinardi. Shuning uchun endi shu o'rniga
  // BUTUN ekranni aniq "Отправлено" holatiga almashtiramiz, tepasida
  // ortga qaytish uchun aniq "← Назад" tugmasi bilan.
  function showSentScreen() {
    content.innerHTML = "";
    var card = makeCard();
    var back = document.createElement("div");
    back.style.cssText = "display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:14.5px;margin-bottom:18px;cursor:pointer;";
    back.innerHTML = "<i class='ti ti-arrow-left' aria-hidden='true'></i> Назад";
    back.onclick = function () { if (backBtn.onclick) backBtn.onclick(); };
    card.appendChild(back);
    var banner = document.createElement("div");
    banner.style.cssText = "background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:22px 16px;text-align:center;font-weight:800;font-size:16px;";
    banner.innerHTML = "<i class='ti ti-circle-check' aria-hidden='true' style='font-size:28px;display:block;margin-bottom:8px;'></i>Отправлено!";
    card.appendChild(banner);
  }

  function sendToBot(payload) {
    if (!tg || !tg.sendData) {
      toast("Откройте это через кнопку в боте.", "err");
      return;
    }
    tg.sendData(JSON.stringify(payload));
    showSentScreen();
  }

  // ------------------------------------------------------------
  // Umumiy komponentlar
  // ------------------------------------------------------------
  function renderOrgPicker(container, onSelect, selectedOrg) {
    var wrap = document.createElement("div");
    wrap.className = "org-grid";
    ORGS.forEach(function (org) {
      var btn = document.createElement("div");
      btn.className = "org-btn" + (org === selectedOrg ? " selected" : "");
      btn.textContent = org;
      btn.onclick = function () {
        Array.prototype.forEach.call(wrap.children, function (c) { c.classList.remove("selected"); });
        btn.classList.add("selected");
        onSelect(org);
      };
      wrap.appendChild(btn);
    });
    container.appendChild(wrap);
    return wrap;
  }

  function makeCard() {
    var c = document.createElement("div");
    c.className = "card";
    content.appendChild(c);
    return c;
  }

  function makeField(card, labelText, tag, opts) {
    opts = opts || {};
    var f = document.createElement("div");
    f.className = "field";
    var label = document.createElement("label");
    label.textContent = labelText;
    f.appendChild(label);
    var el = document.createElement(tag);
    if (tag === "textarea") { el.rows = opts.rows || 3; }
    if (opts.placeholder) el.placeholder = opts.placeholder;
    f.appendChild(el);
    if (opts.hint) {
      var h = document.createElement("div");
      h.className = "hint";
      h.innerHTML = "<i class='ti ti-alert-circle' aria-hidden='true'></i> " + opts.hint;
      f.appendChild(h);
    }
    card.appendChild(f);
    return el;
  }

  function makeFileDrop(card, label, multiple) {
    var wrap = document.createElement("div");
    wrap.className = "field";
    var l = document.createElement("label");
    l.textContent = label;
    wrap.appendChild(l);
    var drop = document.createElement("div");
    drop.className = "file-drop";
    var emptyHtml = "<i class='ti ti-paperclip' aria-hidden='true'></i>Нажмите, чтобы выбрать файл" + (multiple ? "(-ы)" : "");
    drop.innerHTML = emptyHtml;
    var input = document.createElement("input");
    input.type = "file";
    input.style.display = "none";
    if (multiple) input.multiple = true;
    var list = document.createElement("div");
    list.className = "file-list";
    var files = [];
    drop.onclick = function () { input.click(); };
    input.onchange = function () {
      files = Array.prototype.slice.call(input.files);
      list.innerHTML = "";
      if (files.length) {
        drop.classList.add("has-file");
        drop.innerHTML = "<i class='ti ti-circle-check' aria-hidden='true'></i>Выбрано: " + files.length + " файл(ов) — нажмите, чтобы изменить";
        files.forEach(function (f) {
          var d = document.createElement("div");
          d.textContent = "• " + f.name;
          list.appendChild(d);
        });
      } else {
        drop.classList.remove("has-file");
        drop.innerHTML = emptyHtml;
      }
    };
    wrap.appendChild(drop);
    wrap.appendChild(input);
    wrap.appendChild(list);
    card.appendChild(wrap);
    return { getFiles: function () { return files; } };
  }

  function makeSubmitBtn(card, label) {
    var btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = label;
    card.appendChild(btn);
    return btn;
  }

  async function withBusy(btn, fn) {
    var original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = "<i class='ti ti-loader-2' aria-hidden='true'></i>Отправка...";
    try {
      await fn();
    } catch (e) {
      toast("Ошибка: " + (e && e.message ? e.message : e), "err");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  function fmtMoneyMA(n) {
    n = Number(n) || 0;
    var parts = n.toFixed(2).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return parts[0] + (parts[1] !== "00" ? "," + parts[1] : "") + " сум";
  }

  function renderSalaryOrgBlock(container, row, showOrg) {
    var wrap = document.createElement("div");
    wrap.style.cssText = "margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);";
    var lines = [];
    if (showOrg) {
      lines.push('<div style="font-weight:800;margin-bottom:4px;">' + esc(row["Организация"] || "") + "</div>");
      if (row["Профессия"]) lines.push('<div style="color:var(--muted);font-size:13px;margin-bottom:6px;">' + esc(row["Профессия"]) + "</div>");
    }
    var topFields = [
      ["Оклад", "ОкладОбщий"], ["Удалённая работа", "УдаленнаяРабота"], ["KPI", "KPI"],
      ["Премии/бонусы", "Премии"], ["Отпускные", "Отпускные"], ["Больничные", "Больничные"],
      ["Депремирование", "Депремирование"],
    ];
    topFields.forEach(function (pair) {
      var v = Number(row[pair[1]]) || 0;
      if (v !== 0) lines.push('<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;">' +
        "<span>" + pair[0] + "</span><span>" + fmtMoneyMA(v) + "</span></div>");
    });
    var gross = Number(row["НачислениеГросс"]) || 0;
    var taxes = Number(row["НалогиУдержано"]) || 0;
    var taxPct = gross ? (taxes / gross * 100) : 0;
    lines.push('<div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:6px 0 2px;">' +
      "<span>Начислено (Гросс)</span><span>" + fmtMoneyMA(gross) + "</span></div>");
    lines.push('<div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:2px 0;">' +
      "<span>Налог (" + taxPct.toFixed(1) + "%)</span><span>" + fmtMoneyMA(taxes) + "</span></div>");
    lines.push('<div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:2px 0;">' +
      "<span>Начислено (Нетто)</span><span>" + fmtMoneyMA(Number(row["НачислениеНетто"]) || 0) + "</span></div>");
    var other = Number(row["ПрочиеВыплаты"]) || 0;
    if (other !== 0) lines.push('<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;">' +
      "<span>Прочие выплаты</span><span>" + fmtMoneyMA(other) + "</span></div>");
    lines.push('<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0;">' +
      "<span>Выплата аванса</span><span>" + fmtMoneyMA(Number(row["ВыплатаАванса"]) || 0) + "</span></div>");
    lines.push('<div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;color:var(--ok);padding:6px 0 0;">' +
      "<span>Зарплата</span><span>" + fmtMoneyMA(Number(row["ИтогоКВыдаче"]) || 0) + "</span></div>");
    wrap.innerHTML = lines.join("");
    container.appendChild(wrap);
  }

    if (showOrg) {
      var totalWrap = document.createElement("div");

      h.style.cssText = "font-weight:800;margin-bottom:4px;";

      renderSalaryOrgBlock(card, data.total, false);

  function renderSalaryView(card, chatId) {
    var periodRow = document.createElement("div");
    periodRow.className = "field";
    var sel = document.createElement("select");
    periodRow.appendChild(sel);
    card.appendChild(periodRow);
    var dataWrap = document.createElement("div");
    card.appendChild(dataWrap);

    function load(period) {
      dataWrap.innerHTML = "<p style='color:var(--muted);font-size:14px;'><i class='ti ti-loader-2' aria-hidden='true'></i> Загрузка...</p>";
      callApi("miniAppGetSalary", { chatId: chatId, period: period }).then(function (res) {
        if (sel.options.length === 0) {
          (res.periods || []).forEach(function (p) {
            var opt = document.createElement("option");
            opt.value = p; opt.textContent = p;
            sel.appendChild(opt);
          });
          sel.value = res.data.period;
          sel.onchange = function () { load(sel.value); };
        }
        dataWrap.innerHTML = "";
        renderSalaryData(dataWrap, res.data);
      }).catch(function (e) {
        dataWrap.innerHTML = "<p style='color:var(--danger);font-size:14px;'>Ошибка: " + esc(e.message || e) + "</p>";
      });
    }
    load(null);
  }

    postupleniya: {
      icon: "ti-arrow-down-left", color: "#0A84FF", label: "Поступления", title: "Поступления",
      items: ["dogovor", "doverennost", "otherreq_post"],
    },
    realizatsiya: {
      icon: "ti-arrow-up-right", color: "#FF9F0A", label: "Реализация", title: "Реализация",
      items: ["realschet", "zakaznaryad", "otherreq_real"],
    },
  };
  var TOP_MENU = [
    { type: "cat", key: "postupleniya" },
    { type: "cat", key: "realizatsiya" },
    { type: "sec", key: "bank" },
    { type: "sec", key: "salary" },
    { type: "sec", key: "suggestion" },
  ];
  var ICON_COLORS = {
    dogovor: "#0A84FF",
    doverennost: "#BF5AF2",
    bank: "#5E5CE6",
    realschet: "#00C7BE",
    zakaznaryad: "#FF9F0A",
    otherreq_post: "#8E8E93",
    otherreq_real: "#8E8E93",
    salary: "#30D158",
    suggestion: "#FFB800",
  };

  function hexToRgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function renderGrid(entries, getMeta, onClick) {
    content.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "menu-grid";
    entries.forEach(function (entry, idx) {
      var meta = getMeta(entry);
      var item = document.createElement("div");
      item.className = "menu-item" + (meta.isCategory ? " category" : "");
      item.style.animationDelay = (idx * 0.05) + "s";
      item.innerHTML =
        '<span class="icon" style="background:' + meta.color + ';--isd:' + hexToRgba(meta.color, 0.42) + ';animation-delay:' + (idx * 0.05 + 0.08) + 's;">' +
          '<i class="ti ' + meta.icon + '" aria-hidden="true"></i>' +
        '</span>' +
        (meta.isCategory ? '<i class="ti ti-chevron-right chevron" aria-hidden="true"></i>' : '') +
        '<div class="label">' + esc(meta.label) + '</div>';
      item.onclick = function () { onClick(entry); };
      grid.appendChild(item);
    });
    content.appendChild(grid);
  }

  function showMenu() {
    pageTitle.textContent = "Заявки";
    pageSub.textContent = "Выберите тип запроса";
    backBtn.style.display = "none";
    if (tg && tg.BackButton) tg.BackButton.hide();

    renderGrid(TOP_MENU, function (entry) {
      if (entry.type === "cat") {
        var c = CATEGORIES[entry.key];
        return { icon: c.icon, color: c.color, label: c.label, isCategory: true };
      }
      var s = SECTIONS[entry.key];
      return { icon: s.icon, color: ICON_COLORS[entry.key], label: s.label, isCategory: false };
    }, function (entry) {
      if (entry.type === "cat") showCategory(entry.key);
      else showSection(entry.key, showMenu);
    });
  }

  function showCategory(catKey) {
    var cat = CATEGORIES[catKey];
    pageTitle.textContent = cat.title;
    pageSub.textContent = "Выберите тип запроса";
    backBtn.style.display = "inline-flex";
    backBtn.onclick = showMenu;
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(showMenu);
    }
    renderGrid(cat.items, function (key) {
      var s = SECTIONS[key];
      return { icon: s.icon, color: ICON_COLORS[key], label: s.label, isCategory: false };
    }, function (key) {
      showSection(key, function () { showCategory(catKey); });
    });
  }

  function showSection(key, onBack) {
    var s = SECTIONS[key];
    content.innerHTML = "";
    pageTitle.textContent = s.title;
    pageSub.textContent = "Заполните форму ниже";
    backBtn.style.display = "inline-flex";
    backBtn.onclick = onBack;
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(onBack);
    }
    s.render();
  }

  // MUHIM: agar Mini App admin javobidagi "🔁 Отправить ещё" tugmasi
  // orqali ?section=... bilan ochilgan bo'lsa - to'g'ridan-to'g'ri O'SHA
  // bo'limga o'tamiz (asosiy menyudan qayta navigatsiya qilishga hojat
  // qolmaydi - real foydalanuvchi so'ragan yaxshilanish).
  function tryDeepLink() {
    try {
      var params = new URLSearchParams(window.location.search);
      var section = params.get("section");
      if (section && SECTIONS[section]) {
        showSection(section, showMenu);
        return true;
      }
    } catch (e) { /* eski brauzer yoki noto'g'ri parametr - jim menyuga o'tamiz */ }
    return false;
  }

  if (!tryDeepLink()) showMenu();
})();
</script>
</body>
</html>
