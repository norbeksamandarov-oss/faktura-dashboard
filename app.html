<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Заявки — CRB</title>
<meta name="theme-color" content="#0B132B">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B132B;
    --bg: #EEF1F8;
    --card: #FFFFFF;
    --text: #0B132B;
    --muted: #64748B;
    --border: #E5E7EB;
    --ice-soft: #EAF0FF;
    --accent: #2563EB;
    --danger: #B23A3A;
    --danger-bg: #FBE7E7;
    --ok: #1E7A4C;
    --ok-bg: #E3F5E9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-bottom: 32px;
    position: relative;
    overflow-x: hidden;
  }
  /* --- Fon: yumshoq "liquid glass" nur dog'lari (login ekrani bilan bir xil ruhda) --- */
  body::before {
    content: "";
    position: fixed; inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle 340px at 14% 8%, rgba(37,99,235,0.16), transparent 70%),
      radial-gradient(circle 380px at 90% 18%, rgba(110,140,255,0.14), transparent 70%),
      radial-gradient(circle 320px at 30% 92%, rgba(37,99,235,0.10), transparent 70%),
      var(--bg);
  }
  .topbar {
    background: rgba(11,19,43,0.82);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    color: #fff;
    padding: 18px 18px 20px; position: sticky; top: 0; z-index: 10;
    border-radius: 0 0 22px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 30px -18px rgba(11,19,43,0.55);
  }
  .topbar-row { display: flex; align-items: center; gap: 10px; }
  .topbar-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(160deg, #3D7BFF, #0B132B 130%);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .topbar p { margin: 4px 0 0 44px; font-size: 13px; color: rgba(255,255,255,0.55); }
  .back-btn {
    display: none; align-items: center; gap: 6px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.14); color: #fff; padding: 7px 13px; border-radius: 999px;
    font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 12px; cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.18); }
  .content { padding: 16px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .menu-item {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 18px;
    padding: 16px 14px; text-align: left; cursor: pointer;
    box-shadow: 0 8px 22px -14px rgba(11,19,43,0.25);
    transition: transform 0.12s ease;
  }
  .menu-item:active { transform: scale(0.97); }
  .menu-item.category {
    background: linear-gradient(160deg, rgba(37,99,235,0.14), rgba(255,255,255,0.65));
  }
  .menu-item .icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(37,99,235,0.12);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; margin-bottom: 10px;
  }
  .menu-item .label { font-weight: 700; font-size: 13.5px; line-height: 1.25; color: var(--navy); }
  .menu-item .chevron {
    float: right; color: var(--muted); font-size: 15px; margin-top: 8px;
  }
  .card {
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 18px;
    padding: 18px; margin-bottom: 14px;
    box-shadow: 0 10px 26px -16px rgba(11,19,43,0.25);
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select {
    width: 100%; padding: 12px 14px; border-radius: 13px; border: 1px solid rgba(11,19,43,0.1);
    font-family: 'Manrope', sans-serif; font-size: 15px; background: rgba(255,255,255,0.7); color: var(--text);
  }
  .field input[type=text]:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
  }
  .field textarea { resize: vertical; min-height: 90px; }
  .org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .org-btn {
    padding: 12px 8px; border-radius: 13px; border: 1.5px solid rgba(11,19,43,0.1);
    background: rgba(255,255,255,0.6); font-family: 'Manrope', sans-serif; font-size: 12.5px; font-weight: 700;
    cursor: pointer; text-align: center; color: var(--text);
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .org-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
  .type-row { display: flex; gap: 8px; }
  .type-row .org-btn { flex: 1; }
  .file-drop {
    border: 1.5px dashed rgba(11,19,43,0.16); border-radius: 15px; padding: 18px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.5);
  }
  .file-drop i { margin-right: 5px; }
  .file-drop.has-file { border-style: solid; border-color: var(--accent); color: var(--text); background: var(--ice-soft); }
  .file-list { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .file-list div { padding: 3px 0; }
  .submit-btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px;
    box-shadow: 0 12px 24px -10px rgba(37,99,235,0.5);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.55; box-shadow: none; }
  .submit-btn i.ti-loader-2 { animation: spin 0.8s linear infinite; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .hint i { color: #C2650F; margin-right: 2px; }
  .toast {
    position: fixed; bottom: 18px; left: 16px; right: 16px; z-index: 50;
    background: rgba(11,19,43,0.9);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    color: #fff; padding: 13px 16px; border-radius: 14px;
    font-size: 13px; text-align: center; font-weight: 600; opacity: 0; transform: translateY(12px);
    transition: all 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: rgba(178,58,58,0.92); }
  .toast.ok { background: rgba(30,122,76,0.92); }
  .step-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="backBtn"><i class="ti ti-arrow-left" aria-hidden="true"></i> Назад</button>
  <div class="topbar-row">
    <div class="topbar-icon"><i class="ti ti-list-details" aria-hidden="true" style="color:#fff;"></i></div>
    <h1 id="pageTitle">Заявки</h1>
  </div>
  <p id="pageSub">Выберите тип запроса</p>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var API_URL = "https://script.google.com/macros/s/AKfycbzi9RqBAUtexFo4SW0ZVvCq6kjkmLKMCX8_1L6pS5eBYbqDrffaak2yqTveuMPqxadl/exec";

  var ORGS = [
    "TOSHTAN AUTO", "OLTIN TULPOR TRADE", "OLTIN TULPOR MOTORS", "OLTIN TULPOR MOTOR",
    "BEDACHI", "HYUNDAI RM", "HYUNDAI UZBEKISTAN", "GEE MOTORS", "GEE KD",
  ];

  var content = document.getElementById("content");
  var pageTitle = document.getElementById("pageTitle");
  var pageSub = document.getElementById("pageSub");
  var backBtn = document.getElementById("backBtn");
  var toastEl = document.getElementById("toast");

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (kind ? " " + kind : "");
    setTimeout(function () { toastEl.className = "toast"; }, 2600);
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        var base64 = result.split(",")[1] || "";
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadFile(file) {
    var base64 = await fileToBase64(file);
    var resp = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "uploadFile",
        filename: file.name,
        mimeType: file.type || "application/octet-stream",
        base64: base64,
      }),
    });
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data; // { ok, url, fileId, name }
  }

  function sendToBot(payload) {
    if (!tg || !tg.sendData) {
      toast("Откройте это через кнопку в боте.", "err");
      return;
    }
    tg.sendData(JSON.stringify(payload));
    // Odatda sendData chaqirilgach Mini App avtomatik yopiladi (Telegram
    // shunday ishlaydi), lekin ehtiyot uchun bir oz kutib, ochiq qolsa,
    // xabar ko'rsatamiz.
    setTimeout(function () {
      toast("Отправлено! Можно закрыть окно.", "ok");
    }, 300);
  }

  // ------------------------------------------------------------
  // Umumiy komponentlar
  // ------------------------------------------------------------
  function renderOrgPicker(container, onSelect, selectedOrg) {
    var wrap = document.createElement("div");
    wrap.className = "org-grid";
    ORGS.forEach(function (org) {
      var btn = document.createElement("div");
      btn.className = "org-btn" + (org === selectedOrg ? " selected" : "");
      btn.textContent = org;
      btn.onclick = function () {
        Array.prototype.forEach.call(wrap.children, function (c) { c.classList.remove("selected"); });
        btn.classList.add("selected");
        onSelect(org);
      };
      wrap.appendChild(btn);
    });
    container.appendChild(wrap);
    return wrap;
  }

  function makeCard() {
    var c = document.createElement("div");
    c.className = "card";
    content.appendChild(c);
    return c;
  }

  function makeField(card, labelText, tag, opts) {
    opts = opts || {};
    var f = document.createElement("div");
    f.className = "field";
    var label = document.createElement("label");
    label.textContent = labelText;
    f.appendChild(label);
    var el = document.createElement(tag);
    if (tag === "textarea") { el.rows = opts.rows || 3; }
    if (opts.placeholder) el.placeholder = opts.placeholder;
    f.appendChild(el);
    if (opts.hint) {
      var h = document.createElement("div");
      h.className = "hint";
      h.innerHTML = "<i class='ti ti-alert-circle' aria-hidden='true'></i> " + opts.hint;
      f.appendChild(h);
    }
    card.appendChild(f);
    return el;
  }

  function makeFileDrop(card, label, multiple) {
    var wrap = document.createElement("div");
    wrap.className = "field";
    var l = document.createElement("label");
    l.textContent = label;
    wrap.appendChild(l);
    var drop = document.createElement("div");
    drop.className = "file-drop";
    var emptyHtml = "<i class='ti ti-paperclip' aria-hidden='true'></i>Нажмите, чтобы выбрать файл" + (multiple ? "(-ы)" : "");
    drop.innerHTML = emptyHtml;
    var input = document.createElement("input");
    input.type = "file";
    input.style.display = "none";
    if (multiple) input.multiple = true;
    var list = document.createElement("div");
    list.className = "file-list";
    var files = [];
    drop.onclick = function () { input.click(); };
    input.onchange = function () {
      files = Array.prototype.slice.call(input.files);
      list.innerHTML = "";
      if (files.length) {
        drop.classList.add("has-file");
        drop.innerHTML = "<i class='ti ti-circle-check' aria-hidden='true'></i>Выбрано: " + files.length + " файл(ов) — нажмите, чтобы изменить";
        files.forEach(function (f) {
          var d = document.createElement("div");
          d.textContent = "• " + f.name;
          list.appendChild(d);
        });
      } else {
        drop.classList.remove("has-file");
        drop.innerHTML = emptyHtml;
      }
    };
    wrap.appendChild(drop);
    wrap.appendChild(input);
    wrap.appendChild(list);
    card.appendChild(wrap);
    return { getFiles: function () { return files; } };
  }

  function makeSubmitBtn(card, label) {
    var btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = label;
    card.appendChild(btn);
    return btn;
  }

  async function withBusy(btn, fn) {
    var original = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = "<i class='ti ti-loader-2' aria-hidden='true'></i>Отправка...";
    try {
      await fn();
    } catch (e) {
      toast("Ошибка: " + (e && e.message ? e.message : e), "err");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  // ------------------------------------------------------------
  // Har bir bo'lim uchun forma
  // ------------------------------------------------------------
  var SECTIONS = {
    dogovor: {
      icon: "ti-file-text", label: "Договор", title: "Запрос по договору",
      render: function () {
        var card = makeCard();
        var selOrg = null;
        var step1 = document.createElement("div");
        step1.className = "step-label";
        step1.textContent = "1. Организация";
        card.appendChild(step1);
        renderOrgPicker(card, function (org) { selOrg = org; });

        var text = makeField(card, "2. Номер, дата договора и контрагент", "textarea", {
          placeholder: "Договор №15 от 20.08.2026 с «Kadi Agency»",
        });
        var btn = makeSubmitBtn(card, "Отправить запрос");
        btn.onclick = function () {
          if (!selOrg) { toast("Выберите организацию", "err"); return; }
          if (!text.value.trim()) { toast("Напишите текст договора", "err"); return; }
          withBusy(btn, async function () {
            sendToBot({ action: "dogovor", org: selOrg, text: text.value.trim() });
          });
        };
      },
    },
    doverennost: {
      icon: "ti-certificate", label: "Доверенность", title: "Запрос по доверенности",
      render: function () {
        var card = makeCard();
        var selOrg = null;
        var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "1. Организация";
        card.appendChild(s1);
        renderOrgPicker(card, function (org) { selOrg = org; });
        var fileCtl = makeFileDrop(card, "2. Файл (PDF/Excel/Word) или скриншот");
        var kontragent = makeField(card, "3. Для кого (поставщик/контрагент)", "input", { placeholder: "Например: ООО Kadi Agency" });
        kontragent.type = "text";
        var note = makeField(card, "Доп. информация (если есть, например VIN)", "input", { placeholder: "Необязательно" });
        note.type = "text";
        var btn = makeSubmitBtn(card, "Отправить запрос");
        btn.onclick = function () {
          var files = fileCtl.getFiles();
          if (!selOrg) { toast("Выберите организацию", "err"); return; }
          if (!files.length) { toast("Приложите файл", "err"); return; }
          if (!kontragent.value.trim()) { toast("Укажите контрагента", "err"); return; }
          withBusy(btn, async function () {
            var up = await uploadFile(files[0]);
            sendToBot({
              action: "doverennost", org: selOrg, kontragent: kontragent.value.trim(),
              note: note.value.trim(), file_url: up.url, file_name: up.name,
            });
          });
        };
      },
    },
    bank: {
      icon: "ti-building-bank", label: "Банк", title: "Банковский запрос",
      render: function () {
        var card = makeCard();
        var selOrg = null, selType = null;
        var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "1. Организация";
        card.appendChild(s1);
        renderOrgPicker(card, function (org) { selOrg = org; });

        var s2 = document.createElement("div"); s2.className = "step-label"; s2.style.marginTop = "14px"; s2.textContent = "2. Тип операции";
        card.appendChild(s2);
        var typeRow = document.createElement("div");
        typeRow.className = "type-row";
        ["Поступление", "Списание"].forEach(function (label) {
          var b = document.createElement("div");
          b.className = "org-btn";
          b.textContent = label;
          b.onclick = function () {
            Array.prototype.forEach.call(typeRow.children, function (c) { c.classList.remove("selected"); });
            b.classList.add("selected");
            selType = label;
          };
          typeRow.appendChild(b);
        });
        card.appendChild(typeRow);

        var details = makeField(card, "3. Банк, контрагент, договор, сумма, комментарий", "textarea", {
          rows: 4, placeholder: "Банк: ...\nКонтрагент: ...\nДоговор: №.. от ..\nСумма: ...\nКомментарий: ...",
        });
        var btn = makeSubmitBtn(card, "Отправить запрос");
        btn.onclick = function () {
          if (!selOrg) { toast("Выберите организацию", "err"); return; }
          if (!selType) { toast("Выберите тип операции", "err"); return; }
          if (!details.value.trim()) { toast("Заполните детали", "err"); return; }
          withBusy(btn, async function () {
            sendToBot({ action: "bank", org: selOrg, type: selType, details: details.value.trim() });
          });
        };
      },
    },
    realschet: {
      icon: "ti-receipt", label: "Счёт-фактура", title: "Запрос на счёт-фактуру",
      render: function () {
        var card = makeCard();
        var selOrg = null;
        var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "1. Организация";
        card.appendChild(s1);
        renderOrgPicker(card, function (org) { selOrg = org; });
        var fileCtl = makeFileDrop(card, "2. PDF со сканами (договор, доп. соглашения, приложения)");
        var kontragent = makeField(card, "3. Контрагент (покупатель)", "input", {
          placeholder: "Название и ИНН/ПНФЛ", hint: "Обязательно укажите ИНН или ПНФЛ контрагента в этом поле.",
        });
        kontragent.type = "text";
        var note = makeField(card, "Доп. информация (например VIN)", "input", { placeholder: "Необязательно" });
        note.type = "text";
        var btn = makeSubmitBtn(card, "Отправить запрос");
        btn.onclick = function () {
          var files = fileCtl.getFiles();
          if (!selOrg) { toast("Выберите организацию", "err"); return; }
          if (!files.length) { toast("Приложите PDF", "err"); return; }
          if (!kontragent.value.trim()) { toast("Укажите контрагента с ИНН/ПНФЛ", "err"); return; }
          withBusy(btn, async function () {
            var up = await uploadFile(files[0]);
            sendToBot({
              action: "realschet", org: selOrg, kontragent: kontragent.value.trim(),
              note: note.value.trim(), file_url: up.url, file_name: up.name,
            });
          });
        };
      },
    },
    zakaznaryad: {
      icon: "ti-tool", label: "Заказ-наряд", title: "Запрос на заказ-наряд",
      render: function () {
        var card = makeCard();
        var selOrg = null;
        var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "1. Организация";
        card.appendChild(s1);
        renderOrgPicker(card, function (org) { selOrg = org; });
        var fileCtl = makeFileDrop(card, "2. Файл (заказ-наряд, документы)");
        var kontragent = makeField(card, "3. Контрагент (заказчик)", "input", {
          placeholder: "Название и ИНН/ПНФЛ", hint: "Обязательно укажите ИНН или ПНФЛ контрагента в этом поле.",
        });
        kontragent.type = "text";
        var note = makeField(card, "Доп. информация", "input", { placeholder: "Необязательно" });
        note.type = "text";
        var btn = makeSubmitBtn(card, "Отправить запрос");
        btn.onclick = function () {
          var files = fileCtl.getFiles();
          if (!selOrg) { toast("Выберите организацию", "err"); return; }
          if (!files.length) { toast("Приложите файл", "err"); return; }
          if (!kontragent.value.trim()) { toast("Укажите контрагента с ИНН/ПНФЛ", "err"); return; }
          withBusy(btn, async function () {
            var up = await uploadFile(files[0]);
            sendToBot({
              action: "zakaznaryad", org: selOrg, kontragent: kontragent.value.trim(),
              note: note.value.trim(), file_url: up.url, file_name: up.name,
            });
          });
        };
      },
    },
    otherreq_post: {
      icon: "ti-help-circle", label: "Другой запрос", title: "Другой запрос — Поступления",
      render: function () { renderOtherReq("Поступления"); },
    },
    otherreq_real: {
      icon: "ti-help-circle", label: "Другой запрос", title: "Другой запрос — Реализация",
      render: function () { renderOtherReq("Реализация"); },
    },
    salary: {
      icon: "ti-wallet", label: "Зарплата", title: "Зарплата",
      render: function () {
        var card = makeCard();
        var info = document.createElement("p");
        info.style.cssText = "color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px;";
        info.textContent = "Нажмите кнопку ниже, чтобы бот прислал актуальную информацию по вашей зарплате в чат.";
        card.appendChild(info);
        var btn = makeSubmitBtn(card, "Запросить зарплату");
        btn.onclick = function () {
          withBusy(btn, async function () {
            sendToBot({ action: "salary" });
          });
        };
      },
    },
    suggestion: {
      icon: "ti-bulb", label: "Предложение / Жалоба", title: "Предложение или жалоба",
      render: function () {
        var card = makeCard();
        var selType = "Предложение";
        var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "Тип обращения";
        card.appendChild(s1);
        var row = document.createElement("div");
        row.className = "type-row";
        ["Предложение", "Жалоба"].forEach(function (label, i) {
          var b = document.createElement("div");
          b.className = "org-btn" + (i === 0 ? " selected" : "");
          b.textContent = label;
          b.onclick = function () {
            Array.prototype.forEach.call(row.children, function (c) { c.classList.remove("selected"); });
            b.classList.add("selected");
            selType = label;
          };
          row.appendChild(b);
        });
        card.appendChild(row);
        var text = makeField(card, "Текст обращения", "textarea", { rows: 4, placeholder: "Напишите текст..." });
        var btn = makeSubmitBtn(card, "Отправить");
        btn.onclick = function () {
          if (!text.value.trim()) { toast("Напишите текст", "err"); return; }
          withBusy(btn, async function () {
            sendToBot({ action: "suggestion", type: selType, text: text.value.trim() });
          });
        };
      },
    },
  };

  function renderOtherReq(category) {
    var card = makeCard();
    var selOrg = null;
    var s1 = document.createElement("div"); s1.className = "step-label"; s1.textContent = "1. Организация";
    card.appendChild(s1);
    renderOrgPicker(card, function (org) { selOrg = org; });
    var text = makeField(card, "2. Текст запроса", "textarea", { rows: 4, placeholder: "Опишите запрос..." });
    var fileCtl = makeFileDrop(card, "3. Файлы (можно несколько, необязательно)", true);
    var btn = makeSubmitBtn(card, "Отправить запрос");
    btn.onclick = function () {
      var files = fileCtl.getFiles();
      if (!selOrg) { toast("Выберите организацию", "err"); return; }
      if (!text.value.trim() && !files.length) { toast("Напишите текст или приложите файл", "err"); return; }
      withBusy(btn, async function () {
        var uploaded = [];
        for (var i = 0; i < files.length; i++) {
          var up = await uploadFile(files[i]);
          uploaded.push({ url: up.url, name: up.name });
        }
        sendToBot({
          action: "otherreq", org: selOrg, category: category,
          text: text.value.trim(), files: uploaded,
        });
      });
    };
  }

  // ------------------------------------------------------------
  // Navigatsiya: asosiy menyu -> kategoriya -> forma
  // ------------------------------------------------------------
  var CATEGORIES = {
    postupleniya: {
      icon: "ti-arrow-down-left", label: "Поступления", title: "Поступления",
      items: ["dogovor", "doverennost", "otherreq_post"],
    },
    realizatsiya: {
      icon: "ti-arrow-up-right", label: "Реализация", title: "Реализация",
      items: ["realschet", "zakaznaryad", "otherreq_real"],
    },
  };
  var TOP_MENU = [
    { type: "cat", key: "postupleniya" },
    { type: "cat", key: "realizatsiya" },
    { type: "sec", key: "bank" },
    { type: "sec", key: "salary" },
    { type: "sec", key: "suggestion" },
  ];

  function renderGrid(entries, getMeta, onClick) {
    content.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "menu-grid";
    entries.forEach(function (entry) {
      var meta = getMeta(entry);
      var item = document.createElement("div");
      item.className = "menu-item" + (meta.isCategory ? " category" : "");
      item.innerHTML =
        '<span class="icon"><i class="ti ' + meta.icon + '" aria-hidden="true"></i></span>' +
        (meta.isCategory ? '<i class="ti ti-chevron-right chevron" aria-hidden="true"></i>' : '') +
        '<div class="label">' + esc(meta.label) + '</div>';
      item.onclick = function () { onClick(entry); };
      grid.appendChild(item);
    });
    content.appendChild(grid);
  }

  function showMenu() {
    pageTitle.textContent = "Заявки";
    pageSub.textContent = "Выберите тип запроса";
    backBtn.style.display = "none";
    if (tg && tg.BackButton) tg.BackButton.hide();

    renderGrid(TOP_MENU, function (entry) {
      if (entry.type === "cat") {
        var c = CATEGORIES[entry.key];
        return { icon: c.icon, label: c.label, isCategory: true };
      }
      var s = SECTIONS[entry.key];
      return { icon: s.icon, label: s.label, isCategory: false };
    }, function (entry) {
      if (entry.type === "cat") showCategory(entry.key);
      else showSection(entry.key, showMenu);
    });
  }

  function showCategory(catKey) {
    var cat = CATEGORIES[catKey];
    pageTitle.textContent = cat.title;
    pageSub.textContent = "Выберите тип запроса";
    backBtn.style.display = "inline-flex";
    backBtn.onclick = showMenu;
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(showMenu);
    }
    renderGrid(cat.items, function (key) {
      var s = SECTIONS[key];
      return { icon: s.icon, label: s.label, isCategory: false };
    }, function (key) {
      showSection(key, function () { showCategory(catKey); });
    });
  }

  function showSection(key, onBack) {
    var s = SECTIONS[key];
    content.innerHTML = "";
    pageTitle.textContent = s.title;
    pageSub.textContent = "Заполните форму ниже";
    backBtn.style.display = "inline-flex";
    backBtn.onclick = onBack;
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(onBack);
    }
    s.render();
  }

  showMenu();
})();
</script>
</body>
</html>
